<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate QR Anggota KKN</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
        }
        @page { size: A4; margin: 10mm; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-xl flex items-center space-x-2 transform translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toast-msg" class="font-medium">Pesan notifikasi...</span>
    </div>

    <!-- Header -->
    <div class="bg-gradient-to-r from-indigo-700 to-indigo-900 text-white no-print">
        <div class="max-w-5xl mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-extrabold flex items-center gap-2">
                        <i class="fa-solid fa-qrcode"></i> QR Kartu Anggota KKN
                    </h1>
                    <p class="text-indigo-200 text-xs mt-0.5">Cetak QR masing-masing anggota untuk absensi otomatis</p>
                </div>
                <span id="db-status-badge" class="bg-slate-500/30 text-slate-200 text-[10px] font-semibold px-2.5 py-0.5 rounded-full border border-slate-400/30">
                    Menghubungkan...
                </span>
            </div>
            <div class="mt-4 flex flex-wrap gap-2">
                <button onclick="window.print()" class="bg-white text-indigo-900 font-bold text-xs px-4 py-2.5 rounded-xl shadow flex items-center gap-2 hover:bg-indigo-50 transition-all">
                    <i class="fa-solid fa-print"></i> Cetak Semua QR
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 py-6">
        <div id="qr-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <div class="col-span-full text-center text-sm text-slate-400 py-10">Memuat data anggota...</div>
        </div>
    </div>

    <script>
        // ==========================================
        // SUPABASE CONFIGURATION
        // ==========================================
        const SUPABASE_URL = "https://mtxtfkivxmpnsakktzpw.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10eHRma2l2eG1wbnNha2t0enB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDc1MDIsImV4cCI6MjEwMDk4MzUwMn0.XQul1dsbkvI96UFs93tF9mRuXHCrF5PmipGVaAizorE";

        let supabaseClient = null;
        if (typeof supabase !== 'undefined' && supabase.createClient) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        const ABSEN_URL = "https://0xfndlabs.vercel.app/absen.html";

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').className = 'fa-solid fa-' + (type === 'success' ? 'circle-check text-emerald-400' : 'circle-xmark text-rose-400');
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3500);
        }

        function updateStatusBadge(text, ok = true) {
            const badge = document.getElementById('db-status-badge');
            if (!badge) return;
            badge.className = ok
                ? "bg-emerald-500/20 text-emerald-300 text-[10px] font-semibold px-2.5 py-0.5 rounded-full border border-emerald-500/30"
                : "bg-rose-500/20 text-rose-300 text-[10px] font-semibold px-2.5 py-0.5 rounded-full border border-rose-500/30";
            badge.innerText = text;
        }

        async function loadAndGenerate() {
            const grid = document.getElementById('qr-grid');
            try {
                const { data, error } = await supabaseClient.from('anggota').select('*').order('nim');
                if (error) throw error;
                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center text-sm text-slate-400 py-10">Belum ada anggota. Jalankan SQL setup di halaman absen.</div>';
                    return;
                }
                updateStatusBadge(`Terhubung (${data.length} anggota)`);
                grid.innerHTML = '';
                data.forEach(member => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl border border-slate-200 shadow-sm p-4 text-center break-inside-avoid";
                    card.innerHTML = `
                        <div class="w-28 h-28 mx-auto" id="qr-${member.nim}"></div>
                        <p class="mt-3 text-xs font-extrabold text-slate-800 leading-tight">${member.nama}</p>
                        <p class="text-[10px] font-mono text-slate-400 mt-0.5">${member.nim}</p>
                    `;
                    grid.appendChild(card);
                    new QRCode(document.getElementById(`qr-${member.nim}`), {
                        text: `${ABSEN_URL}?qr=${member.nim}`,
                        width: 112,
                        height: 112,
                        correctLevel: QRCode.CorrectLevel.M
                    });
                });
            } catch (e) {
                grid.innerHTML = '<div class="col-span-full text-center text-sm text-rose-500 py-10">Gagal memuat data: ' + e.message + '</div>';
            }
        }

        loadAndGenerate();
    </script>
</body>
</html>
